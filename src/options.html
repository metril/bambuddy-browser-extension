<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bambuddy options</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input[type=text], input[type=password], input[type=number], select { width: 100%; box-sizing: border-box; padding: 6px; }
  .row { display: flex; gap: 6px; }
  .help { font-weight: normal; color: #666; font-size: 12px; margin-top: 2px; }
  .inline { font-weight: normal; display: flex; align-items: center; gap: 6px; }
  .actions { margin-top: 16px; display: flex; gap: 8px; }
  #status { margin-top: 12px; white-space: pre-line; }
  #status.error { color: #b00020; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td, th { text-align: left; padding: 4px; border-bottom: 1px solid #ddd; font-size: 12px; }
</style>
</head>
<body>
<h1>Bambuddy options</h1>
<label>Bambuddy URL <input id="baseUrl" type="text" placeholder="https://bambuddy.example.com" autocomplete="off"></label>
<label>API key
  <span class="row"><input id="apiKey" type="password" placeholder="bb_..." autocomplete="off"><button id="toggleKey" type="button">Show</button></span>
</label>
<label>Upload mode
  <select id="uploadMode">
    <option value="auto">Auto</option>
    <option value="stream">Stream</option>
    <option value="buffer">Buffer</option>
  </select>
  <div class="help">Auto streams uploads and falls back to buffering if the server or proxy doesn't support it.</div>
</label>
<label>Max file size (MB) <input id="maxFileMB" type="number" min="1" step="1"></label>
<label>Bulk concurrency (1-3) <input id="bulkConcurrency" type="number" min="1" max="3" step="1"></label>
<label class="inline"><input id="tagUploads" type="checkbox"> Tag uploads with the site name</label>
<div class="actions"><button id="save" type="button">Save</button><button id="test" type="button">Test connection</button></div>
<div id="status" role="status"></div>
<h2>Diagnostics</h2>
<div id="diag"></div>
<button id="clearDiag" type="button">Clear</button>
<script type="module" src="options.js"></script>
</body>
</html>
